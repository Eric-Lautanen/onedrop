<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>ONE DROP &mdash; Reggae Pinball</title>
<!-- The sprite sheet is the page's one big asset (263 KB webp, and the only
     thing every surface samples, so it gates the first paint of the machine).
     This used to be a <link rel=preload>, which downloads it early but says
     nothing about HOW the download is going -- a loading bar driven off a
     preload can only guess, which is why it used to creep, stall and then
     snap to 100. The download is started here instead, inline and just as
     early, through fetch() with a streaming reader, which hands the bar real
     bytes. assets.js consumes the result (window.__PB_SHEET) and falls back
     to a plain Image, with the original webp -> png ladder, if this script is
     missing or the stream fails. The png fallback is only fetched when the
     webp is refused, so the payload is never doubled. -->
<script>
(function () {
  var SOURCES = ['assets/sprite2.webp', 'assets/sprite2.png'];
  var st = { pct: 0, done: false, failed: false, blob: null };
  var settleHead;
  st.promise = new Promise(function (res) { settleHead = res; });
  window.__PB_SHEET = st;
  function giveUp() { st.failed = true; settleHead(st); }
  if (!window.fetch || !window.Blob) { giveUp(); return; }
  function attempt(i) {
    if (i >= SOURCES.length) { giveUp(); return; }
    if (i > 0) st.pct = 0;
    fetch(SOURCES[i]).then(function (res) {
      if (!res.ok || !res.body || !res.body.getReader) throw new Error('http ' + res.status);
      var total = Number(res.headers.get('content-length')) || 0;
      var reader = res.body.getReader(), got = 0, chunks = [];
      function read() {
        return reader.read().then(function (r) {
          if (r.done) {
            st.blob = new Blob(chunks, { type: res.headers.get('content-type') || 'application/octet-stream' });
            st.pct = 100; st.done = true;
            settleHead(st);
            return;
          }
          chunks.push(r.value); got += r.value.length;
          if (total > 0) st.pct = Math.min(100, Math.round(got / total * 100));
          return read();
        });
      }
      return read();
    }).catch(function () { attempt(i + 1); });
  }
  try { attempt(0); } catch (e) { giveUp(); }
})();
</script>
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>

<div id="stage"></div>
<div id="flash"></div>
<div id="floats"></div>
<div id="vignette"></div>
<div id="scanlines"></div>

<!-- ============ LOADING SCREEN ============ -->
<!-- covers everything until the sprite sheet settles; then it fades and
     the machine + menu drop in. Written by hand, before any script, so it
     shows even if a later script explodes: the game clears it itself
     once its own assets are in. -->
<div id="loader">
  <div class="ld-lock">ONE<b>DROP</b></div>
  <div class="ld-sub">WARMING UP THE RIDDIM</div>
  <div class="ld-bar"><i id="ldFill"></i></div>
  <div class="ld-msg" id="ldMsg">loading&hellip;</div>
</div>

<!-- the dot-matrix canvas is the texture source for the 3D backbox screen.
     A real DMD is a 128 x 32 plasma panel; this canvas is that grid. The
     height starts square-ish to the painted plate and is re-set at boot by
     machine.js to match the plate's exact aspect (see BAND_WIN there). -->
<div id="hud"><canvas id="dmd" width="512" height="181"></canvas></div>

<!-- ============ STATIC MENU (left side) ============ -->
<!-- Three positions, all transform-driven:
     default      dropped down, in your face (attract / game over)
     .tabbed      slid up so only the handle peeks from the top; the
                  handle click pulls it back down (used while playing)
     .above       parked fully above the screen edge until the loader
                  clears, then animates down with a bounce. -->
<aside id="menu">
  <div class="m-logo">ONE<b>DROP</b></div>
  <div class="m-sub">ROOTS &bull; DUB &bull; SKANK</div>
  <div class="rasta-bar m-bar"></div>
  <button id="playBtn" type="button">PLAY</button>
  <div class="m-row"><span>HIGH SCORE</span><b id="menuHigh">0</b></div>
  <div class="m-status" id="menuStatus">PRESS PLAY</div>
  <button id="resetGameBtn" type="button">RESET GAME</button>
  <!-- for tablets: with the view locked, a thumb reaching for a flipper can
       land on the glass without swinging the table. Persisted. -->
  <button id="lockCamBtn" type="button" title="stop taps and drags on the table moving the camera">LOCK CAMERA</button>
  <div class="m-quick">
    <button id="soundBtn" type="button">SOUND ON</button>
    <button id="fxBtn" type="button" title="fancy hit effects: particles, trails, flashes, floating scores">FX ON</button>
    <button id="pauseBtn" type="button">PAUSE</button>
    <button id="fsBtn" type="button">FULLSCREEN</button>
  </div>
  <!-- the fader. 50% is the default; the mix is built so that at 50%
       the band is a bed under the machine and at 100% it is a loud
       arcade, so the middle of the slider is a real listening level. -->
  <div class="m-vol">
    <label for="vol">VOLUME</label>
    <input id="vol" type="range" min="0" max="100" step="1" value="50"
           aria-label="master volume" autocomplete="off">
    <b id="volVal">50%</b>
  </div>
  <div class="m-hint">click a key to rebind it</div>
  <ul class="m-keys">
    <li><button class="keycap" id="keyLeft" type="button">Z</button> left flipper</li>
    <li><button class="keycap" id="keyRight" type="button">/</button> right flipper</li>
    <li><button class="keycap" id="keyPlunge" type="button">SPACE</button> plunge (hold all the way back)</li>
    <li><button class="keycap" id="keyNudgeL" type="button">A</button> nudge left</li>
    <li><button class="keycap" id="keyNudgeR" type="button">D</button> nudge right</li>
    <li><button class="keycap" id="keyReset" type="button">R</button> reset game</li>
    <li><b>M</b> sound &middot; <b>P</b> pause &middot; <b>F</b> fullscreen</li>
  </ul>
  <!-- last child on purpose: when the panel is tabbed up while playing,
       this bottom strip is the only part peeking over the screen edge. -->
  <button id="menuTab" type="button" aria-label="show menu"><span class="ar">&#9662;</span> MENU</button>
</aside>

<div id="fps">-- FPS</div>
<div id="loaderNote" hidden></div>

<div id="touch">
  <button id="touchLeft" aria-label="left flipper">FLIP</button>
  <button id="touchNudgeL" aria-label="nudge left">&larr;</button>
  <button id="touchLaunch" aria-label="plunge">PLUNGE</button>
  <button id="touchNudgeR" aria-label="nudge right">&rarr;</button>
  <button id="touchRight" aria-label="right flipper">FLIP</button>
</div>

<!-- ONE DROP boots as one ES module. three.js dropped its UMD / global build
     in r161 (this project is on r186 now), so the old stack of <script defer>
     tags sharing a single global THREE is gone: src/js/game.js imports the
     file before it, that chain ends at the three.js modules, and the browser
     fetches the whole graph in parallel while evaluating it in the original
     document order. Module scripts are deferred by default, so the loader and
     the menu still paint first, before any game code runs. -->
<script type="module" src="src/js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>polish zoom</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:12px monospace}
.grid{display:flex;flex-wrap:wrap;gap:6px;padding:6px}
figure{margin:0}figcaption{color:#f6c445}canvas{display:block;background:#000;border:1px solid #333}
</style>
</head><body>
<div class="grid" id="grid"></div>
<script>
var CROPS = [
  ['side-elev button zone', 300, 960, 124, 120, 7],
  ['persp button zone', 580, 1020, 120, 120, 7],
  ['persp lockdown front edge', 620, 930, 160, 110, 7],
  ['side-elev rail/lockdown end', 300, 860, 124, 110, 7]
];
var img = new Image();
img.onload = function () {
  var g = document.getElementById('grid');
  CROPS.forEach(function (c) {
    var sw = c[3], sh = c[4], z = c[5];
    var f = document.createElement('figure');
    var cap = document.createElement('figcaption');
    cap.textContent = c[0] + '  @' + z + 'x  [' + c[1] + ',' + c[2] + ']';
    var cv = document.createElement('canvas');
    cv.width = Math.round(sw * z); cv.height = Math.round(sh * z);
    var x = cv.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(img, c[1], c[2], sw, sh, 0, 0, cv.width, cv.height);
    f.appendChild(cap); f.appendChild(cv); g.appendChild(f);
  });
};
img.src = '../assets/3dref.jpg';
</script>
</body></html>

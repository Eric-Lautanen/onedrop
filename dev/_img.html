<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>dev image</title>
<style>
  html,body{margin:0;background:#101216;height:100%;overflow:hidden}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto}
</style></head><body>
<div id="wrap"><img id="im" alt=""></div>
<script>
/* dev/_img.html?src=../dev/shots/foo.png&scale=1   -- scale>1 crops? No:
   keeps the whole image, just sized to fit. Handy for screenshotting crops. */
var q = new URLSearchParams(location.search);
document.getElementById('im').src = q.get('src') || '../dev/shots/ref_topdown.png';
</script>
</body></html>
